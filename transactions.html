<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Últimos Movimientos</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="transactions">

<div class="container mt-5 page-shell">

    <div id="alert-container" class="mb-3"></div>

    <div class="card shadow">

        <div class="card-body">

            <h2 class="text-center mb-4">
                <i class="fa-solid fa-clock-rotate-left me-2"></i>
                Últimos Movimientos
            </h2>

            <form id="transactionsFilterForm" class="mb-4" novalidate>
                <label class="form-label" for="transactionFilter">Filtrar por tipo de movimiento</label>
                <select class="form-select" id="transactionFilter">
                    <option value="all">Todos los movimientos</option>
                    <option value="purchase">Compra</option>
                    <option value="deposit">Depósito</option>
                    <option value="transfer_sent">Transferencia enviada</option>
                </select>
            </form>

            <ul class="list-group" id="transactionsList"></ul>

            <a
                href="menu.html"
                class="btn btn-primary w-100 mt-4">

                <i class="fa-solid fa-arrow-left me-2"></i>
                Volver al Menú Principal

            </a>

        </div>

    </div>

</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/shared.js"></script>
<script src="assets/js/transactions.js"></script>
</body>
</html>
