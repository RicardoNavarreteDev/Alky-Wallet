<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Depositar</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="deposit">

<div class="container mt-5 page-shell">

    <div id="alert-container" class="mb-3"></div>

    <div class="card shadow">

        <div class="card-body">

            <h2 class="text-center mb-4">
                <i class="fa-solid fa-sack-dollar me-2"></i>
                Depositar
            </h2>

            <p class="text-center text-muted mb-4">
                El saldo se actualizará en el menú principal al confirmar el depósito.
            </p>

            <div class="alert alert-light border text-center mb-4">
                Saldo actual: <strong id="currentBalance">$0</strong>
            </div>

            <form id="depositForm" novalidate>

                <div class="mb-3">
                    <label class="form-label">
                        Monto a depositar
                    </label>

                    <input
                        type="number"
                        class="form-control"
                        id="depositAmount"
                        min="1"
                        placeholder="$0">
                </div>

                <button type="submit" class="btn btn-success w-100">
                    <i class="fa-solid fa-circle-check me-2"></i>
                    Realizar depósito
                </button>

            </form>

            <div id="depositLegend" class="mt-3"></div>

            <a href="menu.html" class="btn btn-outline-secondary w-100 mt-3">
                <i class="fa-solid fa-arrow-left me-2"></i>
                Volver al menú
            </a>

        </div>

    </div>

</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/shared.js"></script>
<script src="assets/js/deposit.js"></script>
</body>
</html>
