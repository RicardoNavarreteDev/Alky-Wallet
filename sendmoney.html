<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Enviar Dinero</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="sendmoney">

<div class="container mt-5 page-shell">

    <div id="alert-container" class="mb-3"></div>

    <div class="card shadow">

        <div class="card-body">

            <h2 class="text-center mb-4">
                <i class="fa-solid fa-paper-plane me-2"></i>
                Enviar Dinero
            </h2>

            <form id="contactSearchForm" class="mb-4" novalidate>
                <div class="input-group">
                    <input
                        type="search"
                        class="form-control"
                        id="contactSearch"
                        placeholder="Buscar por nombre o alias">
                    <button type="submit" class="btn btn-outline-primary">
                        <i class="fa-solid fa-magnifying-glass me-2"></i>
                        Buscar
                    </button>
                </div>
            </form>

            <div class="d-flex justify-content-between align-items-center gap-3 mb-3">
                <h5 class="mb-0">Agenda de transferencias</h5>

                <button type="button" class="btn btn-success btn-sm" id="toggleContactFormBtn">
                    <i class="fa-solid fa-user-plus me-2"></i>
                    Agregar nuevo contacto
                </button>
            </div>

            <div id="contactsList" class="list-group mb-4"></div>

            <form id="sendMoneyForm" novalidate>

                <div class="alert alert-light border" id="selectedContactBox">
                    Selecciona un contacto para habilitar el envío.
                </div>

                <div class="mb-3">
                    <label class="form-label" for="sendAmount">Monto a enviar</label>
                    <input
                        type="number"
                        class="form-control"
                        id="sendAmount"
                        min="1"
                        placeholder="$0"
                        required>
                </div>

                <button type="submit" class="btn btn-primary w-100 mb-3 d-none" id="sendMoneyBtn">
                    <i class="fa-solid fa-arrow-up-right-from-square me-2"></i>
                    Enviar dinero
                </button>

            </form>

            <div id="newContactSection" class="card border mt-3 d-none">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="mb-0">
                            <i class="fa-solid fa-address-book me-2"></i>
                            Nuevo Contacto
                        </h5>

                        <button type="button" class="btn-close" id="cancelContactBtn" aria-label="Cancelar"></button>
                    </div>

                    <form id="contactForm" novalidate>
                        <div class="mb-3">
                            <label class="form-label" for="contactName">Nombre y apellido</label>
                            <input
                                type="text"
                                class="form-control"
                                id="contactName"
                                placeholder="Nombre y apellido"
                                required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="contactCbu">Número de CBU</label>
                            <input
                                type="text"
                                class="form-control"
                                id="contactCbu"
                                placeholder="22 dígitos"
                                maxlength="22"
                                required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="contactAlias">Alias</label>
                            <input
                                type="text"
                                class="form-control"
                                id="contactAlias"
                                placeholder="Alias"
                                required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="contactBank">Nombre del Banco</label>
                            <input
                                type="text"
                                class="form-control"
                                id="contactBank"
                                placeholder="Banco"
                                required>
                        </div>

                        <div class="d-flex gap-2 flex-wrap">
                            <button class="btn btn-success" id="saveContactBtn" type="button">
                                <i class="fa-solid fa-floppy-disk me-2"></i>
                                Guardar contacto
                            </button>

                            <button class="btn btn-outline-secondary" type="button" id="cancelContactFormBtn">
                                Cancelar
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <div id="sendConfirmationContainer" class="mt-4"></div>

            <a href="menu.html" class="btn btn-outline-secondary w-100 mt-3">
                <i class="fa-solid fa-arrow-left me-2"></i>
                Volver
            </a>

        </div>

    </div>

</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/shared.js"></script>
<script src="assets/js/sendmoney.js"></script>

</body>
</html>
