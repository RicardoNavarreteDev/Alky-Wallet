<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Menú Principal</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body data-page="menu">

<div class="container mt-5 page-shell">

    <div id="alert-container" class="mb-3"></div>

    <div class="card shadow">
        <div class="card-body text-center">

            <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-3">
                <div class="text-start">
                    <div class="text-muted small">Sesión iniciada</div>
                    <div class="fw-semibold">
                        <i class="fa-solid fa-circle-user me-2"></i>
                        <span id="menuUserEmail">usuario@demo.com</span>
                    </div>
                </div>

                <button type="button" class="btn btn-outline-danger btn-sm" id="logoutBtn">
                    <i class="fa-solid fa-right-from-bracket me-2"></i>
                    Cerrar sesión
                </button>
            </div>

            <h2><i class="fa-solid fa-wallet me-2"></i>Menú Principal</h2>

            <hr>

            <h4>Saldo Actual</h4>

            <p class="saldo" id="menuBalance">$500.000</p>

            <div class="d-grid gap-3 mt-4">

                <button type="button" class="btn btn-success" id="menuDepositBtn">
                    <i class="fa-solid fa-money-bill-wave me-2"></i>
                    Depositar
                </button>

                <button type="button" class="btn btn-primary" id="menuSendBtn">
                    <i class="fa-solid fa-paper-plane me-2"></i>
                    Enviar Dinero
                </button>

                <button type="button" class="btn btn-secondary" id="menuTransactionsBtn">
                    <i class="fa-solid fa-list-ul me-2"></i>
                    Últimos Movimientos
                </button>

            </div>

        </div>
    </div>

</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="./assets/js/shared.js"></script>
<script src="./assets/js/menu.js"></script>
</body>
</html>
